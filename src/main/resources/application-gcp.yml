spring:
  config:
    activate:
      on-profile: gcp
    import: sm://

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:3306/fillinv_backend?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${sm://DB_USERNAME}
    password: ${sm://DB_PASSWORD}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    database: mysql
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  data:
    web:
      pageable:
        default-page-size: 10
        one-indexed-parameters: false

  sql:
    init:
      mode: never

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

logging:
  level:
    root: INFO

jwt:
  secret: ${sm://JWT_SECRET_KEY}
  expiration-time: ${JWT_EXPIRATION_TIME:360000000}

PSP:
  toss:
    secretKey: ${sm://TOSS_SECRET_KEY}
    url: https://api.tosspayments.com
    api:
      connect_timeout: 3s
      read_timeout: 5s

ledger:
  base-url: http://${LEDGER_HOST}:8080
  api:
    connect-timeout: 1s
    read-timeout: 3s
    retry:
      max-attempts: 2
      backoff-ms: 100

resilience4j:
  circuitbreaker:
    instances:
      ledger:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
